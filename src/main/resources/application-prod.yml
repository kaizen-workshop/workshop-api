spring:
  flyway:
    locations: classpath:db/migration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
logging:
  structured:
    format:
      console: ecs
management:
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
app:
  notifications:
    push:
      provider: ${PUSH_PROVIDER:none}
      expo:
        endpoint: ${EXPO_PUSH_ENDPOINT:https://exp.host/--/api/v2/push/send}
        access-token: ${EXPO_ACCESS_TOKEN:}
  security:
    jwt:
      secret: ${JWT_SECRET}
