spring:
  application:
    name: workshop-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: workshop
    default-schema: workshop
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  file-storage:
    local-directory: ${FILE_STORAGE_LOCAL_DIRECTORY:./storage}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-minutes: 15

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB
