spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workshop_api}
    username: ${DB_USERNAME:workshop}
    password: ${DB_PASSWORD:workshop}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

server:
  port: ${SERVER_PORT:8082}

app:
  security:
    jwt:
      # Development-only default. Production still requires JWT_SECRET.
      secret: ${JWT_SECRET:workshop-local-development-jwt-secret-2026}
