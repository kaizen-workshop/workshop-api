services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-workshop_api}
      POSTGRES_USER: ${DB_USERNAME:-workshop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workshop}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Development mail catcher: the API sends to SMTP localhost:1025 (application-dev.yml)
  # and every message, including password-reset codes, can be read at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
