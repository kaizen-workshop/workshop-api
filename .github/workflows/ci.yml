name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # ubuntu-latest ships Docker, so the Testcontainers suites must run here.
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
      # Testcontainers tests use disabledWithoutDocker: without Docker they are skipped
      # silently, which would hide the PostgreSQL/Flyway/concurrency coverage.
      - name: Fail when tests were skipped
        run: |
          skipped=$(grep -h -o 'skipped="[0-9]*"' target/surefire-reports/TEST-*.xml | tr -dc '0-9\n' | awk '{s+=$1} END {print s+0}')
          echo "Skipped tests: $skipped"
          test "$skipped" -eq 0
